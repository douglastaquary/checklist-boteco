quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
%dev.quarkus.http.port=8181
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
checklist.jwt.secret=${JWT_SECRET:change-me-in-production}
checklist.initial-admin-password=${INITIAL_ADMIN_PASSWORD:admin123}
checklist.dynamodb.table=${CHECKLIST_TABLE:checklist-boteco}
purchases.dynamodb.table=${PURCHASES_TABLE:checklist-boteco-purchases}
sales.dynamodb.table=${SALES_TABLE:checklist-boteco-sales}
purchases.local.file=${PURCHASES_LOCAL_FILE:.data/purchases-local.json}
sales.local.file=${SALES_LOCAL_FILE:.data/sales-local.json}
inventory.local.file=${INVENTORY_LOCAL_FILE:.data/inventory-local.json}
inventory.admin-stock.file=${INVENTORY_ADMIN_STOCK_FILE:.data/inventory-admin-stock.json}
purchases.mcp.token=${PURCHASES_MCP_TOKEN:local-purchases-token}
checklist.aws.region=${AWS_REGION:us-east-1}
checklist.auth.expose-device-code=${EXPOSE_DEVICE_CODE:true}
%test.checklist.jwt.secret=test-secret
%test.quarkus.lambda.mock-event-server.test-port=0
%test.inventory.local.file=target/inventory-test.json
worksite.latitude=-23.85491
worksite.longitude=-46.13872
worksite.radiusMeters=5
worksite.name=Beco da Praia
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-5-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
ai.budget.monthly-limit-cents=${AI_MONTHLY_LIMIT_CENTS:500}
ai.budget.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1600}
ai.pricing.input-microdollars-per-million=${AI_INPUT_MICRODOLLARS_PER_MILLION:250000}
ai.pricing.cached-input-microdollars-per-million=${AI_CACHED_INPUT_MICRODOLLARS_PER_MILLION:25000}
ai.pricing.output-microdollars-per-million=${AI_OUTPUT_MICRODOLLARS_PER_MILLION:2000000}
